# ZeroDashboard SPA
#
# Netlify may have "Base directory" = frontend in the site UI. Publish paths are
# relative to that base, so use publish = "dist" (outputs to repo/frontend/dist),
# NOT "frontend/dist" (would become repo/frontend/frontend/dist).
#
# Workspace lockfile + Vite 6 overrides live at repo root — build runs via cd ..

[build]
  base = "frontend"
  command = "cd .. && npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# React Router (SPA): serve index.html for all client-side routes e.g. /dashboard, /incidents/INV-2042

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
