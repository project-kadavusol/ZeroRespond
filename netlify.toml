# Build from repo root so npm workspaces + lockfile apply (pins Vite 6 — avoids Rolldown native bindings on Linux CI).
# Publish the Vite output under frontend/dist.

[build]
  command = "npm ci && npm run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "22"

# React Router (SPA): serve index.html for all client-side routes e.g. /dashboard, /incidents/INV-2042

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
